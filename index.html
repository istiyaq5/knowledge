<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- navbar start -->
    <nav class="navbar">
      <!-- logo -->
      <div>
        <img src="assets/logo-navbar.png" alt="logo" />
      </div>

      <!-- menu -->
      <div class="menu">
        <ul>
          <li>Features</li>
          <li>How It Works</li>
          <li>Why It's Different</li>
        </ul>
      </div>

      <!-- button -->
      <div class="early-access">
        <button>Get Early Access</button>
      </div>
    </nav>
    <!-- navbar end -->

    <!-- hero section start -->
    <section class="hero-section">
      <div class="hero-content">
        <span class="badge"
          ><img src="Group 5.png" alt="" />Early Access Now Open</span
        >

        <h1>
          Structured Thinking,<br />
          <span>Not Just Note-Taking.</span>
        </h1>

        <p>
          A private space to store notes, links, and learning summaries —
          designed to help you think clearly, connect ideas, and turn learning
          into long-term knowledge.
        </p>

        <div class="hero-buttons">
          <button class="primary-btn">
            Start Building Your Vault
            <img src="assets/ArrowRight.png" alt="" />
          </button>

          <button class="secondary-btn">
            <i class="fa-solid fa-play"></i>
            See How It Works
          </button>
        </div>
      </div>
    </section>
    <!-- hero section end -->

   
  </body>
</html>
